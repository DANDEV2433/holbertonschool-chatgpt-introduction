<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Background Color</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 50px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
</style>
</head>
<body>

<h2>Click the button to change the background color</h2>

<button id="colorButton">Change Color</button> <!-- Fixed ID -->

<script>
    // Select the button
    var colorButton = document.getElementById("colorButton");
    
    // Add an event listener if the button exists
    if (colorButton) {
        colorButton.addEventListener("click", function() {
            changeBackgroundColor();
        });
    } else {
        console.error("Button with ID 'colorButton' not found.");
    }

    // Function to change the background color
    function changeBackgroundColor() {
        // Generate a random color and ensure it's 6 characters long
        var randomColor = "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0");
        // Change the background color of the body
        document.body.style.backgroundColor = randomColor;
    }
</script>

</body>
</html>
